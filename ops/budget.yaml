# Quanto lavoro fa Claude in una notte. Dal 2026-11-28 Federico ha il piano Max e il PC e' escluso: una sola
# sessione notturna nel cloud (01:07: raccolta, revisione, ricerca e resoconto) fa tutto il lavoro, su tutta Italia.
# I limiti di utilizzo del piano sono condivisi con l'uso di Federico durante il giorno: se una sessione si ferma per
# i limiti, la notte dopo abbassa questi numeri e scrivilo nel registro.
# Lo leggono `python -m pipeline.piano_notte` (piano della notte) e `python -m pipeline.pubblica` (campione).
# Piano Pro (riferimento): ricerche_max 70, coda_max 30, campione 10, test_copertura 10, fonti_note 8, comuni 6,
# ambiti_categorie 4, categorie_nuove 10, fonti_nuove 5, posizioni 10, giro 0, province_italia 0.

piano: max

ricerche_max: 500            # WebSearch + WebFetch in tutta la notte (una sessione)
coda_max: 100                # eventi della coda di revisione da lavorare
campione: 20                 # eventi del controllo a campione; soglia di qualita': 90%
test_copertura: 20           # eventi del test di copertura
fonti_note: 40               # fonti note in scadenza da riaprire (ops/fonti.yaml)
giro: 40                     # fonti del giro (config/sources.yaml) da leggere a rotazione
fonti_nuove: 40              # fonti nuove da cercare e valutare in tutta Italia (agente fonti; robots.txt e termini)
verifiche_fonti: 12          # fonti da verificare (robots.txt e termini): nessun divieto = ammessa
# Dal 2026-11-28 pomeriggio tutte le province hanno la stessa priorita' (Treviso compresa): niente piu' ricerca
# dedicata a Treviso, le province girano a rotazione divise tra gli agenti italia-a e italia-b.
province_italia: 20          # province d'Italia a rotazione per notte (pipeline/italia.py)
comuni_per_provincia: 3      # comuni da controllare in ognuna, oltre al capoluogo
ambiti_per_provincia: 1      # ambiti di ops/categorie-ricerca.md da cercare in ognuna
categorie_nuove: 25          # voci nuove da aggiungere all'albero delle categorie
posizioni: 60                # luoghi di ops/posizioni.json da sistemare (indirizzo completo, stesso punto)
