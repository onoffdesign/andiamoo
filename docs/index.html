<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andiamoo</title>
<meta name="description" content="Concerti, sagre, gare, mostre e incontri in provincia di Treviso, su una mappa aggiornata ogni giorno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=3" rel="stylesheet">
</head>
<body>
<div class="stage">
  <div id="map" class="map" role="region" aria-label="Mappa degli eventi"></div>

  <!-- testata flottante -->
  <header class="float brand-pill">
    <span class="wordmark" id="site-title">Andiamoo</span>
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-area">Provincia di Treviso</span>
  </header>
  <div class="float top-right">
    <label class="search">
      <span class="sr">Cerca un evento</span>
      <input id="q" type="search" placeholder="Cerca: jazz, sagra, Conegliano…" autocomplete="off">
    </label>
    <button id="report-btn" class="pill-btn" type="button">Segnala <span aria-hidden="true">+</span></button>
  </div>

  <!-- giorni -->
  <nav class="float days" aria-label="Scegli i giorni">
    <div class="presets" role="group" aria-label="Periodo">
      <button type="button" data-preset="today">Oggi</button>
      <button type="button" data-preset="weekend">Weekend</button>
      <button type="button" data-preset="week">7 giorni</button>
      <button type="button" data-preset="all" aria-pressed="true">Tutti</button>
    </div>
    <div id="strip" class="strip" role="group" aria-label="Eventi per giorno"></div>
  </nav>

  <!-- elenco e scheda -->
  <aside class="float panel" id="panel">
    <button class="panel-head" id="sheet-handle" type="button" aria-expanded="false">
      <span class="kicker">Eventi</span>
      <span class="count" id="count-label">…</span>
    </button>
    <div class="panel-body" id="panel-body">
      <ol id="list" class="list" aria-live="polite"></ol>
      <article id="detail" class="detail" hidden></article>
      <footer class="note">
        <p>Eventi raccolti da siti pubblici, giornali locali e segnalazioni, riassunti con l'AI. Orari e programmi possono cambiare: fa fede il sito ufficiale.</p>
        <p id="removal"></p>
        <p id="updated"></p>
      </footer>
    </div>
  </aside>

  <!-- categorie e filtri -->
  <section class="float filters" aria-label="Filtri">
    <div class="chips-row">
      <div id="chips" class="chips" role="group" aria-label="Categorie"></div>
      <button id="more-filters" class="chip more-filters" type="button" aria-expanded="false" aria-controls="selects">Filtri</button>
    </div>
    <div class="selects" id="selects">
      <label><span class="sr">Accesso</span><select id="access"><option value="">Accesso: tutti</option></select></label>
      <label><span class="sr">Per chi</span><select id="audience"><option value="">Per chi: tutti</option></select></label>
      <label><span class="sr">Dove</span><select id="setting"><option value="">Al chiuso e all'aperto</option></select></label>
      <button id="reset" class="text-btn" type="button" hidden>Azzera</button>
    </div>
  </section>

  <div class="float zoom" role="group" aria-label="Zoom">
    <button type="button" id="zoom-in" aria-label="Avvicina">+</button>
    <button type="button" id="zoom-out" aria-label="Allontana">−</button>
  </div>
</div>

<dialog id="report" class="report">
  <form method="dialog">
    <h2>Segnala un evento</h2>
    <p>Lo controlliamo e, se va bene, finisce sulla mappa.</p>
    <ul id="report-options" class="report-options"></ul>
    <button class="cta" value="close"><span>Chiudi</span></button>
  </form>
</dialog>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
