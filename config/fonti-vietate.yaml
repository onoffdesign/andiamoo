# REGOLA FONTI: piattaforme con divieto di scraping (decisa da Federico il 2026-11-28).
#
# vietate         termini d'uso o robots.txt vietano scraping, crawling o estrazione automatica. Mai visitate,
#                 scaricate o analizzate in automatico (neanche per scoprire eventi), mai i loro endpoint interni o
#                 servizi terzi che fanno scraping, mai proxy, IP a rotazione o user agent falsi, mai copiare testi,
#                 descrizioni o immagini. Il loro link puo' stare solo come "Iscrizioni su ..." (ticket_url), preso da
#                 una fonte ammessa.
# da_verificare   aggregatori e piattaforme di cui non sono ancora stati letti termini d'uso e robots.txt. In caso di
#                 dubbio valgono come vietate: il codice le tratta esattamente come le vietate finche' non passano in
#                 "ammesse" (o in "vietate") con la data e la pagina dei termini letta.
# ammesse         aggregatori e piattaforme verificati: termini e robots.txt non vietano l'accesso automatico.
#                 I siti ufficiali di organizzatori, sedi, comuni, pro loco e uffici turistici sono ammessi senza
#                 stare in elenco; il PC rispetta comunque il loro robots.txt a ogni lettura.
# api             unica eccezione: piattaforma vietata con chiave API ufficiale valida, usata nel rispetto delle sue
#                 condizioni (vale solo per le chiamate all'API, non per le pagine del sito).
#
# Verifica (Federico, 2026-11-28): si leggono solo robots.txt e termini e condizioni. Nessun divieto di scraping,
# crawling, estrazione automatica, data mining o riuso automatizzato (dei dati degli eventi o simili) e robots.txt
# che non blocca le pagine degli eventi = fonte valida, in "ammesse" con data e pagine lette. Divieto = "vietate" con
# la frase. Pagine non leggibili = resta in "da_verificare".
#
# "dominio" vale anche per i sottodomini (eventbrite.it copre www.eventbrite.it). "percorso" limita a una parte del
# sito. Prima di aggiungere una fonte nuova al giro: leggere robots.txt e termini d'uso e scriverla qui.
# Lo controllano: python -m pipeline.fonti_vietate --url <link>   e   python -m pipeline.editorial --controlla

