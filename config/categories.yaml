# Tassonomia eventi a due livelli.
# Ispirata a Eventbrite (macro-aree), Fever/Xceed (nightlife), eventiesagre (sagre, mercatini),
# insolitotrantran (tono locale) e running.life (sport partecipativo).
# "id" e' la chiave stabile usata nei dati e negli URL; "label" e' quello che vede l'utente.
# "keywords" serve al classificatore di riserva quando l'AI non e' disponibile o non e' ammessa per una fonte.

categories:
  - id: musica
    label: Musica
    icon: "🎵"
    color: "#a393ff"
    sub:
      concerti: Concerti live
      jazz-classica: Jazz e classica
      festival-musicali: Festival musicali
      dj-set: DJ set
    keywords: [concerto, live, band, jazz, orchestra, cantautore, tour, festival musicale, rock, rap, sinfonic, coro, chitarr]

  - id: nightlife
    label: Nightlife e party
    icon: "🪩"
    color: "#ff7eb6"
    sub:
      club: Club e discoteca
      party: Feste a tema
      aperitivo: Aperitivi e serate
    keywords: [discoteca, club, dj, party, halloween party, serata, after, aperitivo, disco, nightlife]

  - id: sagre-feste
