# Luoghi con coordinate verificate: il PC li usa prima di OpenStreetMap (Nominatim) quando il nome compare nel
# luogo o nell'indirizzo di un evento dello stesso comune. Servono per i posti che Nominatim non trova dal testo
# delle fonti (nomi tra parentesi, iniziali, indirizzi scritti male) e che tornano ogni settimana.
# Ogni voce: nomi (parti di testo da riconoscere, senza maiuscole ne' accenti), comune, lat, lon, nota (da dove
# vengono le coordinate). Aggiungere solo coordinate verificate su una fonte affidabile.
