# Fonti degli eventi. Ogni fonte ha un "type" che sceglie il raccoglitore:
#   tribe_api   WordPress + The Events Calendar (API /wp-json/tribe/events/v1)
#   jsonld      pagine con dati strutturati schema.org Event (elenco ed eventualmente schede)
#   myportal    portali comunali MyPortal della Regione Veneto (API pubblica dei contenuti)
#   rss_news    feed di notizie: l'AI riconosce gli articoli che annunciano eventi
#   ical        calendari .ics
#   html_llm    pagina qualsiasi: il testo va all'AI che estrae gli eventi
#
# Campi comuni:
#   enabled     on/off
#   ai_rewrite  se l'AI puo' riassumere/riscrivere i testi della fonte (false = solo dati fattuali + link)
#   default_category  categoria usata se la fonte e' tematica (es. sport)
#   note        stato della verifica fatta sul sito
#
# Verificate il 28/10/2026 dal browser (robots.txt e struttura dati).

sources:

  # ---------- Redazione (revisione notturna di Claude) ----------
  - id: redazione
    name: Redazione ANDIAMO?
    type: redazione
    enabled: true
    ai_rewrite: true
    note: "Eventi trovati ogni notte da Claude su siti ufficiali e verificati: config/eventi_redazione.yaml."

  # ---------- Aggregatori locali ----------
  - id: insolitotrantran
    name: Insolito Tran Tran
    type: tribe_api
    portal: true          # grande portale: solo "scoperta", con tetto per giro
    max_events: 40
    enabled: false
    base_url: https://www.insolitotrantran.it
    per_page: 50
    max_pages: 6
    ai_rewrite: true
    note: "API pubblica, robots.txt libero. ~100 eventi TV+VE; luogo spesso solo nel testo -> AI. 2026-11-13: disattivata da Claude, l'API tribe risponde 404 da piu' giri (plugin rimosso o spostato); da riprovare se il sito torna a pubblicarla."

  - id: eventiesagre
    name: eventiesagre.it
    type: jsonld
    portal: true          # grande portale: solo "scoperta", con tetto per giro
    max_events: 40
    enabled: false          # 2026-11-28: vietata, i termini su iubenda vietano copia e opere derivate (regola fonti)
    listing_urls:                     # {Mese} = mese corrente, {Mese+1} = successivo
      - https://www.eventiesagre.it/cerca/cat/sez/{Mese}/Veneto/TV/cit/rilib
      - https://www.eventiesagre.it/cerca/cat/sez/{Mese+1}/Veneto/TV/cit/rilib
    max_pages: 1                      # le pagine "/pag-N.htm" danno 404 (verificato dal PC il 29/10/2026)
    detail_link_regex: 'https://www\.eventiesagre\.it/[A-Za-z_+]+/\d{4,}_[^"#?]+\.html$'
    fetch_details: true
    ai_rewrite: true
    note: "JSON-LD Event nelle schede. Luogo = solo comune -> AI cerca l'indirizzo nel testo."

  - id: 2night
    name: 2night Treviso
    type: jsonld
    portal: true          # grande portale: solo "scoperta", con tetto per giro
    max_events: 40
    enabled: true
    listing_urls:
      - https://www.2night.it/treviso/eventi.html
    detail_link_regex: '^https://www\.2night\.it/[0-9a-f]{6}-/[^?#]+\.html$'
    fetch_details: true
    ai_rewrite: true
    note: "JSON-LD Event nelle schede (luogo con via). robots vieta solo URL con ?"

  # ---------- Biglietterie e piattaforme ----------
  - id: eventbrite
    name: Eventbrite
    type: jsonld
    portal: true          # grande portale: solo "scoperta", con tetto per giro
    max_events: 40
    enabled: false        # REGOLA FONTI 2026-11-28: piattaforma vietata (config/fonti-vietate.yaml)
    free_listing_urls:      # elenco "solo gratuiti": accesso su iscrizione, prezzo gratuito (2026-11-06)
      - https://www.eventbrite.it/d/italy--treviso--85685297/free--events/
    listing_urls:
      - https://www.eventbrite.it/d/italy--treviso/all-events/
      - https://www.eventbrite.it/d/italy--treviso/business--events/
      - https://www.eventbrite.it/d/italy--treviso/sports-and-fitness--events/
      - https://www.eventbrite.it/d/italy--conegliano/all-events/
      - https://www.eventbrite.it/d/italy--castelfranco-veneto/all-events/
    page_param: page
    max_pages: 3
    fetch_details: false
    pagina_iscrizione: true   # la pagina Eventbrite e' la pagina di iscrizione dell'organizzatore: diventa link d'azione (2026-10-31)
    ai_rewrite: true
    note: "ItemList JSON-LD con coordinate, 20 eventi per pagina. Le pagine /d/ sono consentite."

  - id: ticketone
    name: TicketOne
    type: jsonld
    portal: true          # grande portale: solo "scoperta", con tetto per giro
    max_events: 40
    enabled: false        # REGOLA FONTI 2026-11-28: piattaforma vietata (config/fonti-vietate.yaml)
    listing_urls:
      - https://www.ticketone.it/cityd/treviso-2045/
      - https://www.ticketone.it/cityd/conegliano-1116/
      - https://www.ticketone.it/venue/teatro-accademia-16706/
      - https://www.ticketone.it/venue/auditorium-fondazione-cassamarca-89469/
      - https://www.ticketone.it/venue/teatro-cristallo-87927/
    fetch_details: false
    ai_rewrite: false
    note: "Evento + luogo + prezzo minimo nel JSON-LD della pagina citta'. Altri comuni: aggiungere le loro pagine /city/. 2026-11-11: le pagine /cityd/ danno ancora 0 eventi al PC; aggiunte le pagine dei locali /venue/ (Teatro Accademia: 43 eventi, 10 per pagina, letti da Claude con WebFetch), da controllare nel prossimo rapporto. 2026-10-30: zero eventi dalla pagina /en/, passata alla versione italiana /cityd/ (che elenca eventi) e aggiunta Conegliano."

  - id: ticketone-categorie
    name: TicketOne (pagine per categoria e citta')
    type: html_llm
    portal: true
    max_events: 30
    enabled: false        # REGOLA FONTI 2026-11-28: piattaforma vietata (config/fonti-vietate.yaml)
    listing_urls:
      - https://www.ticketone.it/cityd/treviso-2045/concerti-55/
      - https://www.ticketone.it/cityd/treviso-2045/teatro-58/
      - https://www.ticketone.it/cityd/conegliano-1116/concerti-55/
    hint: "Elenchi TicketOne di concerti e teatro per citta': ogni riga ha data, ora, titolo, sala e citta'. Tenere solo gli eventi in provincia di Treviso (la pagina mostra anche Venezia e Padova). Accesso biglietto; official_url il link /event/ della riga."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-17: la fonte jsonld ticketone da' 0 eventi dalle pagine /cityd/ (nessun JSON-LD), mentre le pagine /concerti-55/ e /teatro-58/ si leggono come testo (Conegliano: 13 concerti il 16/11; Treviso: 2 concerti il 17/11, uno mancante). Se raddoppia con ticketone, disattivare le /cityd/ in quella."

  - id: dice
    name: DICE
    type: jsonld
    enabled: false        # REGOLA FONTI 2026-11-28: piattaforma vietata (config/fonti-vietate.yaml)
    listing_urls:
      - https://dice.fm/venue/treviso-opendream-lkgx
      - https://dice.fm/venue/giardini-sud-ovest-castello-di-castelfranco-veneto-xeqma
    fetch_details: false
    ai_rewrite: false
    note: "Pagine locale con Place.event. robots: search=yes, use=reference -> niente riscrittura AI, solo dati e link."

  - id: running-life
    name: running.life (podismo)
    type: jsonld
    enabled: true
    listing_urls:
      - https://running.life/calendario-podismo/italia/veneto/treviso
    fetch_details: false
    ai_rewrite: true
    default_category: sport
    default_subcategory: corsa
    note: "SportsEvent con coordinate. Copre gare e non competitive nel raggio di Treviso."

  - id: calendariopodismo
    name: Calendario Podismo
    type: calendariopodismo
    enabled: true
    listing_urls:
      - https://www.calendariopodismo.it/?localita=treviso
    skip_link_regex: "parkrun-italia"
    ai_rewrite: false
    note: "Scheda gara con data, comune, distanze, partenza e coordinate. robots: use=reference -> lettore a regole, niente AI."

  - id: podismoveneto
    name: Calendario Podismo Veneto
    type: podismoveneto
    enabled: true
    base_url: https://calendariopodismoveneto.blogspot.com
    provinces: ["TV", "PD", "VE", "VI", "VR", "BL", "RO"]   # tutto il Veneto (area tutta Italia dal 2026-11-28)
    ai_rewrite: false
    note: "Blog con pagine mensili, una riga per gara. Si tengono solo le gare (TV), non annullate."

  - id: gotrail
    name: gotrail.run (trail)
    type: jsonld
    enabled: true
    listing_urls:
      - https://gotrail.run/calendario-trail/italia/veneto/conegliano
    fetch_details: false
    ai_rewrite: true
    default_category: sport
    default_subcategory: outdoor
    note: "Stesso formato di running.life. Letta da Claude (giro) il 2026-11-28: l'elenco si apre, 4 trail fino a marzo, gia' sul sito o con schede vecchie (Ridges Trail 14/2 con dati del 2023)."

  - id: vivaticket
    name: Vivaticket
    type: html_llm
    enabled: false
    note: "Protetto da sistema anti-bot (Imperva): non si raccoglie in automatico. Eventi via bot/modulo."

  - id: xceed
    name: Xceed
    type: html_llm
    enabled: false
    note: "Treviso senza eventi al 28/10/2026. Riattivare se compaiono club della provincia."

  # ---------- Locali e organizzatori (fonti dirette) ----------
  # Obiettivo nel tempo: molte fonti piccole invece di pochi portali.
  # Il file data/scoperte.csv (generato a ogni giro) elenca i siti ufficiali trovati negli eventi dei portali:
  # quelli che ricorrono spesso vanno aggiunti qui. Modello da copiare:
  #
  # - id: nome-locale
  #   name: Nome del locale
  #   type: jsonld          # se il sito ha dati strutturati, altrimenti html_llm
  #   enabled: true
  #   listing_urls: [https://www.sito-del-locale.it/eventi/]
  #   ai_rewrite: true

  # ---------- Enti pubblici ----------
  - id: comune-treviso
    name: Comune di Treviso
    type: myportal
    enabled: true
    base_url: https://www.comune.treviso.it
    ipa: C_L407
    page_size: 40
    ai_rewrite: true
    note: "API MyPortal. Altri comuni MyPortal: stesso tipo, cambia base_url e codice IPA."

  - id: biblioteche-treviso
    name: Biblioteche Comunali di Treviso
    type: myportal
    enabled: false
    base_url: https://www.bibliotecatreviso.it
    ipa: C_L407_BIBLIO
    page_size: 40
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-10-31: portale MyPortal (/myportal/C_L407_BIBLIO/), stesso tipo del Comune. Da controllare nel rapporto la prima notte: se 0 eventi o errore, il tipo di contenuto potrebbe non essere pnrr_event."
    # 2026-11-02: disattivata da Claude: robots.txt di bibliotecatreviso.it vieta /myportal/ (WebFetch: robots_disallowed) e il PC ha trovato 0 eventi due notti di fila. Non riattivare senza permesso del sito.

  - id: comune-mogliano
    name: Comune di Mogliano Veneto
    type: myportal
    enabled: true
    base_url: https://www.comunemoglianoveneto.it
    ipa: C_F269
    town: Mogliano Veneto
    page_size: 40
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-06: i documenti del Comune sono su /myportal/C_F269/ (MyPortal della Regione Veneto). Da controllare nel rapporto la prima notte: se errore o 0 eventi, verificare robots e tipo di contenuto."

  - id: comune-paese
    name: Comune di Paese
    type: myportal
    enabled: true
    base_url: https://www.comune.paese.tv.it
    ipa: C_G229
    town: Paese
    page_size: 40
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-01: il sito del Comune e' MyPortal della Regione Veneto. Codice IPA dal codice catastale (G229): da controllare nel rapporto la prima notte. 2026-11-28 (giro di Claude): l'API risponde 'status ok' ma con 0 contenuti pnrr_event, anche senza il filtro della cartella /Eventi: il Comune non pubblica eventi su MyPortal oppure il codice IPA e' sbagliato; WebFetch del sito mostra solo il testo del framework. Da rivedere (cercare la pagina eventi vera del Comune)."

  - id: comune-spresiano
    name: Comune di Spresiano
    type: myportal
    enabled: true
    base_url: https://www.comune.spresiano.tv.it
    ipa: C_I927
    town: Spresiano
    page_size: 40
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-16: la pagina del Comune descrive i servizi MyPortal; codice IPA dal codice catastale I927. Da controllare nel rapporto: se 404, passare a html_llm su /home/vivere/eventi.html come Maser e Loria. Quinto giro del 2026-11-28: l'API risponde ma da' solo 5 progetti annuali per giovani (Altavventura, Passaporto per il futuro...), nessun evento datato."

  - id: comune-maser
    name: Comune di Maser
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.maser.tv.it/home/vivere/eventi.html]
    hint: "Eventi del Comune di Maser (TV), anno 2026 se non indicato; town Maser se non indicato."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-01: sito MyPortal (/home/vivere/...). Codice IPA dal codice catastale (F009): da controllare nel rapporto la prima notte. 2026-11-13: l'API MyPortal con il codice catastale da' 404 dal PC; passata a html_llm sulla pagina eventi come Silea (stesso portale, funziona)."

  - id: comune-povegliano
    name: Comune di Povegliano
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.povegliano.tv.it/home/vivere/eventi.html]
    hint: "Eventi del Comune di Povegliano (TV), anno 2026 se non indicato; town Povegliano se non indicato."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-02: sito MyPortal (/home/vivere/eventi.html, schede /eventi/<nome>.html). Codice IPA dal codice catastale (G944): da controllare nel rapporto la prima notte. 2026-11-13: l'API MyPortal con il codice catastale da' 404 dal PC; passata a html_llm sulla pagina eventi come Silea (stesso portale, funziona)."

  - id: comune-loria
    name: Comune di Loria
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.loria.tv.it/home/vivere/eventi.html]
    hint: "Eventi del Comune di Loria (TV), anno 2026 se non indicato; town Loria se non indicato."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-02: schede /eventi/<nome>.html come Povegliano (MyPortal). Codice IPA dal codice catastale (E692): da controllare nel rapporto la prima notte. 2026-11-13: l'API MyPortal con il codice catastale da' 404 dal PC; passata a html_llm sulla pagina eventi come Silea (stesso portale, funziona)."

  - id: comune-trevignano
    name: Comune di Trevignano
    type: myportal
    enabled: true
    base_url: https://www.comune.trevignano.tv.it
    ipa: C_L402
    town: Trevignano
    page_size: 40
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-08: la home del Comune ha titolo myPortal. Codice IPA dal codice catastale (L402, da confermare): da controllare nel rapporto la prima notte."

  - id: comune-gaiarine
    name: Comune di Gaiarine
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.gaiarine.tv.it/home/vivere/eventi.html]
    hint: "Eventi del Comune di Gaiarine (TV), anno 2026 se non indicato; town Gaiarine se non indicato."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-08: pagina eventi /home/vivere/eventi.html come Povegliano e Loria (MyPortal). Codice IPA dal codice catastale (D854, da confermare): da controllare nel rapporto la prima notte. 2026-11-13: l'API MyPortal con il codice catastale da' 404 dal PC; passata a html_llm sulla pagina eventi come Silea (stesso portale, funziona)."

  # ---------- Siti con il tema "design comuni" (WordPress, /vivere-il-comune/eventi/) ----------
  # Nessun JSON-LD: la pagina elenco ha titolo, giorno e link; il modello locale estrae gli eventi (costo zero
  # crediti Claude). Aggiunti da Claude il 2026-11-02: da controllare nel rapporto la prima notte.
  - id: comune-san-biagio
    name: Comune di San Biagio di Callalta
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.sanbiagio.tv.it/eventi/]
    hint: "Eventi del Comune di San Biagio di Callalta (TV), anno 2026 se non indicato; town San Biagio di Callalta se non indicato."
    ai_rewrite: true
    note: "WordPress con tema design-comuni: elenco con giorno, titolo e link alla scheda. 8 eventi futuri al 2026-11-02."

  - id: comune-roncade
    name: Comune di Roncade
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.roncade.tv.it/it/eventi]
    hint: "Eventi del Comune di Roncade (TV), anno 2026 se non indicato; town Roncade se non indicato (frazioni Biancade, San Cipriano, Musestre, Ca' Tron, Vallio)."
    ai_rewrite: true
    note: "Aggiunto da Claude il 2026-11-11. Sito Municipium: elenco con giorno, titolo e link alla scheda (15 eventi futuri in prima pagina, orari e luoghi solo nelle schede). Anche Breda di Piave usa Municipium (breda-di-piave-api.municipiumapp.it): stesso schema da provare. Da controllare nel prossimo rapporto."

  - id: comune-sernaglia
    name: Comune di Sernaglia della Battaglia
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.sernaglia.tv.it/eventi]
    hint: "Eventi del Comune di Sernaglia della Battaglia (TV), anno 2026 se non indicato; town Sernaglia della Battaglia se non indicato (frazioni Fontigo, Falze' di Piave)."
    ai_rewrite: true
    note: "Aggiunto da Claude il 2026-11-06: stesso tema design-comuni di San Biagio, 9 eventi tra 6 e 20 novembre; schede con ora e luogo."

  - id: comune-castelfranco
    name: Comune di Castelfranco Veneto
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.castelfrancoveneto.tv.it/tutti-gli-eventi/]
    hint: "Eventi del Comune di Castelfranco Veneto (TV); town Castelfranco Veneto se non indicato."
    ai_rewrite: true
    note: "Stesso tema design-comuni di San Biagio; era in ops/fonti.yaml (qualita' 5), letta a mano dalla redazione."

  - id: mattorosso
    name: Mattorosso Montebelluna
    type: html_llm
    enabled: true
    listing_urls: [https://mattorosso.it/eventi]
    hint: "Calendario del locale Mattorosso, Via Piave 108, Montebelluna (TV): concerti, dj set, comicita', karaoke, social run. Anno 2026 per novembre-dicembre, 2027 da gennaio se non indicato; venue Mattorosso, town Montebelluna."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-07: elenco con ~20 date in una pagina (WebFetch la apre, quindi i robot non la vietano); orari e prezzi solo nelle schede. Gli eventi fino al 17/12 sono anche in eventi_redazione: controllare i doppioni nel primo rapporto."

  - id: teatro-cristallo-oderzo
    name: Teatro Cristallo Oderzo
    type: html_llm
    enabled: true
    listing_urls: [https://www.cinemacristallo.com/teatro-cristallo-oderzo/]
    hint: "Stagione teatrale e concerti del Teatro Cristallo, Via Garibaldi 44, Oderzo (TV). Le date sono senza anno: 2026 per novembre-dicembre, 2027 da gennaio. Venue Teatro Cristallo, town Oderzo. Ignorare i film della programmazione del cinema."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-16: elenco di 10 spettacoli e concerti della stagione 2026/27 (nessuno era sul sito); ore solo nelle schede /movie/<titolo>/ (Innuendo Experience 26 e 27/11 alle 21). Aggiunta anche la pagina /venue/teatro-cristallo-87927/ alla fonte ticketone."

  - id: scopri-oderzo
    name: Scopri Oderzo (IAT di Oderzo)
    type: html_llm
    enabled: true
    listing_urls: [https://www.scoprioderzo.it/my-calendar/]
    hint: "Calendario dell'ufficio turistico IAT di Oderzo (TV), plugin My Calendar: mese corrente, anno 2026 se non indicato. Town Oderzo se non indicato; sedi frequenti Palazzo Foscolo (Via Garibaldi 65), Museo Archeologico Eno Bellis, Museo del Duomo. Le mostre compaiono divise per settimana: tenerle come un solo evento con inizio e fine."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-17: sito ufficiale IAT, 6 voci da meta' novembre (concerto a Palazzo Foscolo, Te' al museo, mostra Magnolato), orari e ingresso nelle schede /mc-events/. Nessun feed iCal visibile. Giro del 2026-11-28: ogni mese si legge con /my-calendar/?format=list&time=month&yr=AAAA&month=M e la pagina contiene JSON-LD Event (nome, inizio, fine, url) ma con location VirtualLocation: il luogo e' solo nel testo della scheda. Febbraio e marzo 2027 ancora vuoti."

  - id: fondazione-benetton
    name: Fondazione Benetton Studi Ricerche
    type: html_llm
    enabled: true
    listing_urls: [https://fbsr.it/eventi/]
    hint: "Agenda della Fondazione Benetton Studi Ricerche, Treviso: incontri, proiezioni e concerti a Palazzo Bomben (Via Cornarotta 7) e nella chiesa di San Teonisto (Via San Nicolo' 31). Anno 2026 se non indicato, 2027 da gennaio. Escludere eventi online (Zoom) e quelli per le scuole."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-17: 5 eventi da meta' novembre in una pagina, nessuno era sul sito; orari solo nelle schede /evento/ (rifiutate a WebFetch se non escono da una ricerca). Biglietti su liveticket.it. Giro del 2026-11-28: /agenda-home/ e /agenda/ vuote a WebFetch (contenuto caricato da script); WebSearch mostra ancora schede /evento/ del 2026 (presentazione del 1/12 a Palazzo Bomben): non disattivata, da controllare nel rapporto del PC. Secondo giro del 2026-11-28: /agenda-home/ reindirizza a https://fbsr.it/eventi/, che con curl ha l'elenco in HTML (4 eventi in programma) e le schede /evento/<slug>/ con data, ora e luogo: indirizzo corretto."

  - id: comune-quinto
    name: Comune di Quinto di Treviso
    type: html_llm
    enabled: true
    listing_urls: [https://www.comune.quintoditreviso.tv.it/eventi/]
    hint: "Eventi del Comune di Quinto di Treviso (TV), anno 2026 se non indicato; town Quinto di Treviso se non indicato."
    ai_rewrite: true
    note: "Aggiunta da Claude il 2026-11-05: WordPress tema design-comuni come San Biagio (schede /vivere-il-comune/eventi/...). Elenco /eventi/ dal menu del sito: controllare nel rapporto la prima notte."

  - id: comune-silea
    name: Comune di Silea
    type: html_llm
